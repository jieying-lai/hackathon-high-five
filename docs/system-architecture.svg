<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif} .title{font-size:25px;font-weight:bold;fill:#0f172a}.body{font-size:14px;fill:#475569}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#6366f1"/></marker></defs><text x="60" y="65" class="title">CareerLens AI | Current system architecture</text><text x="60" y="100" class="body">Member 3 UI integration · 20 Oct 2026 · Solid lines: active paths · Dashed: future integration</text><rect x="60" y="150" width="310" height="190" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="80" y="185" class="title" style="font-size:18px">Browser UI</text><text x="80" y="215" class="body">Talent: intake, chips, radar, matches</text><text x="80" y="239" class="body">Pathway and fairness disclosure</text><text x="80" y="263" class="body">HR: skills heatmap and training</text><text x="80" y="287" class="body">EN / BM / Chinese core interface</text><rect x="460" y="150" width="320" height="190" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="480" y="185" class="title" style="font-size:18px">Flask + role-based sessions</text><text x="480" y="215" class="body">/workspace: candidate.html / hr.html</text><text x="480" y="239" class="body">/api/analyze /api/trends</text><text x="480" y="263" class="body">/api/hr/heatmap /api/hr/assignments</text><text x="480" y="287" class="body">Rules-based matching (current)</text><rect x="870" y="95" width="320" height="130" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="890" y="130" class="title" style="font-size:18px">SQLite</text><text x="890" y="160" class="body">Accounts, jobs, training assignments</text><rect x="870" y="265" width="320" height="150" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="890" y="300" class="title" style="font-size:18px">JSON catalogs / demo data</text><text x="890" y="330" class="body">Future roles and course catalog</text><text x="890" y="354" class="body">Synthetic people and workforce</text><rect x="460" y="460" width="320" height="120" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="480" y="495" class="title" style="font-size:18px">ArXiv paper feed</text><text x="480" y="525" class="body">HTTPS with timeout / demo fallback</text><text x="480" y="549" class="body">Trend values: illustrative benchmarks</text><rect x="870" y="475" width="320" height="110" rx="18" fill="white" stroke="#c7d2fe" stroke-width="2"/><text x="890" y="510" class="title" style="font-size:18px">RunPod (not connected)</text><text x="890" y="540" class="body">Handler exists; Flask call not wired</text><path d="M370 245 H460" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M780 210 H825 V160 H870" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M780 285 H825 V335 H870" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M620 340 V460" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M780 315 H835 V530 H870" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="60" y="630" width="1130" height="85" rx="16" fill="#eef2ff"/><text x="80" y="662" class="body">Browser storage: language preference, questionnaire answers, HR review decisions (no cross-device sync).</text><text x="80" y="690" class="body">Fairness: protected inputs excluded; statistical parity audit remains pending. No live labor-market forecast.</text></svg>
