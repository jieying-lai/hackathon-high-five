<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="retrieverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="retrieverFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fbb572"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="retrieverEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="retrieverCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cuteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="120" cy="120" r="105" fill="url(#retrieverGlow)"/>

  <!-- Character Group -->
  <g filter="url(#cuteShadow)">
    <!-- Fluffy Left Ear -->
    <path d="M 52,90 C 35,115 32,150 50,165 C 65,178 80,155 75,130 Z" fill="url(#retrieverEar)"/>
    <path d="M 52,100 C 42,120 42,145 54,155 C 62,162 70,148 68,130 Z" fill="#b45309" opacity="0.15"/>

    <!-- Fluffy Right Ear -->
    <path d="M 188,90 C 205,115 208,150 190,165 C 175,178 160,155 165,130 Z" fill="url(#retrieverEar)"/>
    <path d="M 188,100 C 198,120 198,145 186,155 C 178,162 170,148 172,130 Z" fill="#b45309" opacity="0.15"/>

    <!-- Head -->
    <ellipse cx="120" cy="115" rx="68" ry="62" fill="url(#retrieverFur)"/>
    
    <!-- Forehead Golden Tuft -->
    <path d="M 112,56 C 116,46 124,46 128,56 C 124,54 116,54 112,56 Z" fill="#fef3c7" opacity="0.8"/>
    <path d="M 104,60 C 112,50 120,50 126,60 Z" fill="#fed7aa"/>

    <!-- Muzzle / Cheeks -->
    <ellipse cx="120" cy="132" rx="42" ry="32" fill="#fffbeb"/>

    <!-- Kawaii Shiny Big Eyes -->
    <!-- Left Eye -->
    <circle cx="94" cy="106" r="13" fill="#1c1917"/>
    <circle cx="90" cy="102" r="5" fill="#ffffff"/>
    <circle cx="98" cy="110" r="2.2" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="146" cy="106" r="13" fill="#1c1917"/>
    <circle cx="142" cy="102" r="5" fill="#ffffff"/>
    <circle cx="150" cy="110" r="2.2" fill="#ffffff"/>

    <!-- Soft Rosy Blush Cheeks -->
    <ellipse cx="76" cy="126" rx="9" ry="6" fill="#f43f5e" opacity="0.32"/>
    <ellipse cx="164" cy="126" rx="9" ry="6" fill="#f43f5e" opacity="0.32"/>

    <!-- Cute Heart-Shaped Nose -->
    <path d="M 120,126 C 114,120 108,124 112,131 L 120,138 L 128,131 C 132,124 126,120 120,126 Z" fill="#1c1917"/>
    <circle cx="118" cy="124" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- Happy Open Puppy Smile & Pink Tongue -->
    <path d="M 120,138 L 120,144" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 108,143 C 114,148 120,147 120,144 C 120,147 126,148 132,143" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Little Tongue -->
    <path d="M 114,146 C 114,156 126,156 126,146 Z" fill="#fb7185"/>

    <!-- Collar & Companion Tag -->
    <rect x="86" y="168" width="68" height="12" rx="6" fill="url(#retrieverCollar)"/>
    <circle cx="120" cy="184" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <path d="M 120,178 L 122,183 L 126,184 L 122,186 L 120,191 L 118,186 L 114,184 L 118,183 Z" fill="#ffffff"/>
  </g>
</svg>
