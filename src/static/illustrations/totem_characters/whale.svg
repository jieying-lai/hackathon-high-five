<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="whaleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whaleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="whaleBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="whaleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="105" fill="url(#whaleGlow)"/>

  <g filter="url(#whaleShadow)">
    <!-- Cute Star Spout on Top of Head -->
    <path d="M 120,68 C 118,52 110,42 102,46 C 112,46 116,56 118,68 Z" fill="#38bdf8"/>
    <path d="M 120,68 C 122,52 130,42 138,46 C 128,46 124,56 122,68 Z" fill="#38bdf8"/>
    <!-- Glowing Little Star on Spout -->
    <path d="M 120,38 L 122,43 L 127,44 L 123,47 L 124,52 L 120,49 L 116,52 L 117,47 L 113,44 L 118,43 Z" fill="#facc15"/>

    <!-- Round Chubby Whale Body -->
    <path d="M 45,125 C 45,82 85,72 130,72 C 175,72 195,95 195,128 C 195,160 160,172 120,172 C 75,172 45,160 45,125 Z" fill="url(#whaleBody)"/>

    <!-- Cute Tail Fins -->
    <path d="M 190,128 C 210,115 224,105 220,120 C 218,128 200,132 192,130 Z" fill="#0284c7"/>
    <path d="M 190,128 C 210,140 224,150 220,136 C 218,128 200,125 192,126 Z" fill="#0369a1"/>

    <!-- Pearly Soft Belly -->
    <path d="M 60,138 C 60,138 85,168 130,168 C 170,168 185,148 185,148 C 185,148 165,170 120,170 C 80,170 60,138 60,138 Z" fill="url(#whaleBelly)"/>
    <!-- Belly Groove Lines -->
    <path d="M 90,154 C 105,162 135,162 150,154" stroke="#bae6fd" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 100,160 C 110,166 130,166 140,160" stroke="#bae6fd" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Waving Little Side Flipper -->
    <path d="M 90,142 C 75,148 68,162 80,166 C 92,168 100,155 96,142 Z" fill="#0284c7"/>

    <!-- Joyful Kawaii Big Eyes -->
    <circle cx="86" cy="116" r="11" fill="#082f49"/>
    <circle cx="83" cy="113" r="4" fill="#ffffff"/>
    <circle cx="89" cy="120" r="1.8" fill="#ffffff"/>

    <circle cx="144" cy="116" r="11" fill="#082f49"/>
    <circle cx="141" cy="113" r="4" fill="#ffffff"/>
    <circle cx="147" cy="120" r="1.8" fill="#ffffff"/>

    <!-- Gentle Big Happy Smile -->
    <path d="M 102,128 C 112,136 122,136 132,128" fill="none" stroke="#082f49" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sweet Pink Cheeks -->
    <ellipse cx="72" cy="126" rx="8" ry="5.5" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="156" cy="126" rx="8" ry="5.5" fill="#f43f5e" opacity="0.35"/>
  </g>
</svg>
