<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="leoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fae8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f5d0fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5d0fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leoFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="leoVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="leoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="105" fill="url(#leoGlow)"/>

  <g filter="url(#leoShadow)">
    <!-- Round Cute Cat Ears -->
    <path d="M 58,82 C 45,45 80,45 92,72 Z" fill="#c7d2fe"/>
    <path d="M 66,78 C 56,52 80,52 86,72 Z" fill="#f472b6" opacity="0.6"/>

    <path d="M 182,82 C 195,45 160,45 148,72 Z" fill="#c7d2fe"/>
    <path d="M 174,78 C 184,52 160,52 154,72 Z" fill="#f472b6" opacity="0.6"/>

    <!-- Head -->
    <ellipse cx="120" cy="118" rx="66" ry="58" fill="url(#leoFur)"/>

    <!-- Cyber Rosette Spots (Cute modern stylized rings) -->
    <circle cx="112" cy="74" r="3.5" fill="#a5b4fc"/>
    <circle cx="128" cy="74" r="3.5" fill="#a5b4fc"/>
    <circle cx="120" cy="68" r="3" fill="#a5b4fc"/>
    <!-- Cheek spots -->
    <circle cx="68" cy="112" r="3" fill="#c084fc" opacity="0.6"/>
    <circle cx="72" cy="120" r="2.5" fill="#c084fc" opacity="0.6"/>
    <circle cx="172" cy="112" r="3" fill="#c084fc" opacity="0.6"/>
    <circle cx="168" cy="120" r="2.5" fill="#c084fc" opacity="0.6"/>

    <!-- Muzzle -->
    <ellipse cx="120" cy="136" rx="36" ry="26" fill="#ffffff"/>

    <!-- Sparkling Violet Big Anime Eyes -->
    <ellipse cx="92" cy="110" rx="13" ry="14" fill="#6d28d9"/>
    <ellipse cx="92" cy="112" rx="10" ry="11" fill="#8b5cf6"/>
    <circle cx="92" cy="112" r="6.5" fill="#1e1b4b"/>
    <circle cx="88" cy="106" r="4.5" fill="#ffffff"/>
    <circle cx="96" cy="114" r="2" fill="#ffffff"/>

    <ellipse cx="148" cy="110" rx="13" ry="14" fill="#6d28d9"/>
    <ellipse cx="148" cy="112" rx="10" ry="11" fill="#8b5cf6"/>
    <circle cx="148" cy="112" r="6.5" fill="#1e1b4b"/>
    <circle cx="144" cy="106" r="4.5" fill="#ffffff"/>
    <circle cx="152" cy="114" r="2" fill="#ffffff"/>

    <!-- Cyber Headset Wing on Left Ear -->
    <path d="M 46,95 C 44,80 54,82 58,95 C 60,105 48,105 46,95 Z" fill="url(#leoVisor)"/>
    <circle cx="52" cy="95" r="3" fill="#22d3ee"/>

    <!-- Cute Heart-Shaped Little Nose -->
    <path d="M 120,130 C 117,126 112,128 115,133 L 120,137 L 125,133 C 128,128 123,126 120,130 Z" fill="#f43f5e"/>

    <!-- Sweet Kitty Smile -->
    <path d="M 112,142 C 116,146 120,145 120,142 C 120,145 124,146 128,142" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Whisker Marks -->
    <circle cx="106" cy="138" r="1.2" fill="#94a3b8"/>
    <circle cx="104" cy="142" r="1.2" fill="#94a3b8"/>
    <circle cx="134" cy="138" r="1.2" fill="#94a3b8"/>
    <circle cx="136" cy="142" r="1.2" fill="#94a3b8"/>

    <!-- Rosy Cheek Blush -->
    <ellipse cx="76" cy="128" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="164" cy="128" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>
  </g>
</svg>
