<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="owlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c7d2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="owlBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="owlGlasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="owlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="105" fill="url(#owlGlow)"/>

  <g filter="url(#owlShadow)">
    <!-- Feather Tufts / Ears -->
    <path d="M 68,75 C 60,35 90,55 96,72 Z" fill="#312e81"/>
    <path d="M 72,68 C 68,45 85,58 90,68 Z" fill="#6366f1"/>

    <path d="M 172,75 C 180,35 150,55 144,72 Z" fill="#312e81"/>
    <path d="M 168,68 C 172,45 155,58 150,68 Z" fill="#6366f1"/>

    <!-- Round Chubby Body -->
    <ellipse cx="120" cy="125" rx="66" ry="60" fill="url(#owlBody)"/>

    <!-- Soft Cloud Belly -->
    <ellipse cx="120" cy="145" rx="42" ry="34" fill="url(#owlBelly)"/>
    <!-- Cute Data Feather Chevrons on Belly -->
    <path d="M 112,136 L 120,140 L 128,136" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 108,148 L 120,153 L 132,148" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 114,160 L 120,164 L 126,160" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Wings on Sides -->
    <path d="M 54,115 C 48,135 55,160 70,170 C 65,150 62,130 65,115 Z" fill="#1e1b4b"/>
    <path d="M 186,115 C 192,135 185,160 170,170 C 175,150 178,130 175,115 Z" fill="#1e1b4b"/>

    <!-- Big Round Eyepatch Rings -->
    <circle cx="92" cy="106" r="24" fill="#ffffff"/>
    <circle cx="148" cy="106" r="24" fill="#ffffff"/>

    <!-- Brilliant Luminous Amber/Teal Irises -->
    <circle cx="94" cy="106" r="14" fill="#0d9488"/>
    <circle cx="146" cy="106" r="14" fill="#0d9488"/>
    <!-- Pupils -->
    <circle cx="95" cy="106" r="8.5" fill="#042f2e"/>
    <circle cx="145" cy="106" r="8.5" fill="#042f2e"/>
    <!-- Catchlights -->
    <circle cx="91" cy="102" r="3.5" fill="#ffffff"/>
    <circle cx="97" cy="109" r="1.5" fill="#ffffff"/>
    <circle cx="141" cy="102" r="3.5" fill="#ffffff"/>
    <circle cx="147" cy="109" r="1.5" fill="#ffffff"/>

    <!-- Chic Round Smart Glasses -->
    <circle cx="92" cy="106" r="26" fill="none" stroke="url(#owlGlasses)" stroke-width="3.5"/>
    <circle cx="148" cy="106" r="26" fill="none" stroke="url(#owlGlasses)" stroke-width="3.5"/>
    <path d="M 118,105 L 122,105" stroke="url(#owlGlasses)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cute Amber Beak -->
    <path d="M 114,114 Q 120,111 126,114 Q 120,128 114,114 Z" fill="#f59e0b"/>

    <!-- Soft Rosy Blush -->
    <ellipse cx="68" cy="124" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="172" cy="124" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>

    <!-- Tiny Feet -->
    <ellipse cx="106" cy="184" rx="7" ry="4" fill="#f59e0b"/>
    <ellipse cx="134" cy="184" rx="7" ry="4" fill="#f59e0b"/>
  </g>
</svg>
