<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="hawkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hawkFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hawkGoggles" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="hawkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="105" fill="url(#hawkGlow)"/>

  <g filter="url(#hawkShadow)">
    <!-- Sleek Crest Tufts -->
    <path d="M 120,60 C 122,38 140,42 142,58 Z" fill="#92400e"/>
    <path d="M 112,62 C 114,44 128,46 130,60 Z" fill="#b45309"/>

    <!-- Head & Body -->
    <ellipse cx="120" cy="120" rx="64" ry="58" fill="url(#hawkFeathers)"/>

    <!-- Fluffy Golden Cream Chest -->
    <ellipse cx="120" cy="144" rx="42" ry="32" fill="#fffbeb"/>
    <!-- Cute Chevron Feathers on Chest -->
    <path d="M 114,136 L 120,140 L 126,136" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 110,146 L 120,151 L 130,146" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cute Aviator Goggles on Forehead -->
    <rect x="74" y="66" width="92" height="10" rx="5" fill="#475569"/>
    <!-- Left Goggle Lens -->
    <circle cx="94" cy="71" r="14" fill="#38bdf8" stroke="url(#hawkGoggles)" stroke-width="3.5"/>
    <ellipse cx="91" cy="68" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>
    <!-- Right Goggle Lens -->
    <circle cx="146" cy="71" r="14" fill="#38bdf8" stroke="url(#hawkGoggles)" stroke-width="3.5"/>
    <ellipse cx="143" cy="68" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>

    <!-- Big Confident Cute Eyes -->
    <circle cx="92" cy="108" r="13" fill="#1c1917"/>
    <circle cx="92" cy="108" r="9" fill="#d97706"/>
    <circle cx="92" cy="108" r="5" fill="#1c1917"/>
    <circle cx="88" cy="104" r="4" fill="#ffffff"/>
    <circle cx="95" cy="111" r="1.8" fill="#ffffff"/>

    <circle cx="148" cy="108" r="13" fill="#1c1917"/>
    <circle cx="148" cy="108" r="9" fill="#d97706"/>
    <circle cx="148" cy="108" r="5" fill="#1c1917"/>
    <circle cx="144" cy="104" r="4" fill="#ffffff"/>
    <circle cx="151" cy="111" r="1.8" fill="#ffffff"/>

    <!-- Sharp yet Adorable Curved Golden Beak -->
    <path d="M 112,110 Q 120,108 128,110 Q 124,128 120,132 Q 116,128 112,110 Z" fill="#f59e0b"/>
    <circle cx="118" cy="114" r="1" fill="#78350f"/>

    <!-- Soft Rosy Blush -->
    <ellipse cx="72" cy="124" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="168" cy="124" rx="8" ry="5" fill="#f43f5e" opacity="0.3"/>

    <!-- Tiny Feet -->
    <ellipse cx="106" cy="180" rx="7" ry="4" fill="#f59e0b"/>
    <ellipse cx="134" cy="180" rx="7" ry="4" fill="#f59e0b"/>
  </g>
</svg>
