<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lh_aurora" x1="15" y1="15" x2="195" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="lh_teal" x1="35" y1="175" x2="180" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="lh_text" x1="230" y1="60" x2="620" y2="140" gradientUnits="userSpaceOnUse">
