      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g id="Figma_Logo_Mark" transform="translate(10, 10)">
    <rect x="10" y="10" width="180" height="180" rx="46" fill="url(#lh_aurora)" />
    <rect x="16" y="16" width="168" height="168" rx="40" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="96" cy="104" r="50" stroke="#E2E8F0" stroke-width="12" />
    <path d="M 132 69 A 50 50 0 1 0 138 132" stroke="url(#lh_aurora)" stroke-width="14" stroke-linecap="round" />
    <circle cx="96" cy="104" r="30" stroke="url(#lh_teal)" stroke-width="3.5" stroke-dasharray="7 5" />
    <path d="M 64 128 Q 90 126 105 98 T 145 55" stroke="url(#lh_teal)" stroke-width="8.5" stroke-linecap="round" fill="none" />
    <path d="M 126 53 L 148 52 L 147 74" stroke="#14B8A6" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 156 34 C 156 43 159 46 168 46 C 159 46 156 49 156 58 C 156 49 153 46 144 46 C 153 46 156 43 156 34 Z" fill="#EC4899" />
    <circle cx="96" cy="104" r="9.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="3.5" />
  </g>

  <!-- Right Wordmark & Tagline Group -->
  <g id="Figma_Typography_Lockup">
    <text x="225" y="112" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#lh_text)">CareerLens</text>
    
    <!-- AI Pill Badge -->
