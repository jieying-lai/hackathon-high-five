<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Aurora Gradient -->
    <linearGradient id="cl_aurora" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Secondary Teal-Indigo Lens Gradient -->
    <linearGradient id="cl_teal" x1="40" y1="190" x2="195" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Frosted Glass Highlight -->
    <linearGradient id="cl_glass" x1="30" y1="25" x2="200" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.72" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="cl_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Group 1: Outer Squircle Aurora Frame -->
  <g id="Figma_Layer_Outer_Frame" filter="url(#cl_shadow)">
    <rect x="20" y="20" width="200" height="200" rx="52" fill="url(#cl_aurora)" />
    <rect x="26" y="26" width="188" height="188" rx="46" fill="url(#cl_glass)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Group 2: Ambient Pastel Glass Blobs inside Badge -->
  <g id="Figma_Layer_Glass_Glow" opacity="0.35">
    <circle cx="72" cy="72" r="42" fill="#F472B6" />
    <circle cx="168" cy="165" r="46" fill="#2DD4BF" />
    <circle cx="162" cy="76" r="36" fill="#818CF8" />
  </g>

  <!-- Group 3: CareerLens Optical Ring ("C" Aperture) -->
  <g id="Figma_Layer_Career_Lens">
    <!-- Outer Track Ring -->
    <circle cx="116" cy="124" r="58" stroke="#E2E8F0" stroke-width="14" />
    <!-- Active Gradient C-Lens Arc -->
    <path d="M 157 83 A 58 58 0 1 0 164 156" stroke="url(#cl_aurora)" stroke-width="16" stroke-linecap="round" />
    <!-- Inner Precision Radar Ring -->
    <circle cx="116" cy="124" r="36" stroke="url(#cl_teal)" stroke-width="4" stroke-dasharray="8 6" />
  </g>

  <!-- Group 4: Rising Career Pathway Arrow & AI North Star -->
  <g id="Figma_Layer_Pathway_And_AI_Star">
    <!-- Ascending Career Trajectory Curve -->
    <path d="M 78 152 Q 108 150 126 118 T 172 68" stroke="url(#cl_teal)" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Arrowhead -->
    <path d="M 150 66 L 175 65 L 174 90" stroke="#14B8A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- AI 4-Point Sparkle Star at Apex -->
    <path d="M 182 44 C 182 55 185 58 196 58 C 185 58 182 61 182 72 C 182 61 179 58 168 58 C 179 58 182 55 182 44 Z" fill="#EC4899" />
    <!-- Core Talent Node -->
    <circle cx="116" cy="124" r="11" fill="#4F46E5" stroke="#FFFFFF" stroke-width="4" />
  </g>
</svg>
