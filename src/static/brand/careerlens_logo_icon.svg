<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Squircle Base Shadow -->
    <filter id="cuteShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4F46E5" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EC4899" flood-opacity="0.22" />
    </filter>

    <!-- App Squircle Glow Background -->
    <linearGradient id="squircleBg" x1="20" y1="18" x2="220" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="48%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Frosted Glass Inner Container -->
    <linearGradient id="glassPillow" x1="30" y1="28" x2="210" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#F3E8FF" stop-opacity="0.82" />
    </linearGradient>

    <!-- Owl Body Gradient: Dreamy Violet-Indigo to Bubblegum Pink -->
    <linearGradient id="owlBody" x1="45" y1="50" x2="195" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Owl Tummy Gradient (Fluffy warm pearl) -->
    <linearGradient id="owlTummy" x1="70" y1="80" x2="170" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>

    <!-- Mag Glass Cyan-Emerald Lens -->
    <linearGradient id="lensGlass" x1="100" y1="70" x2="195" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Inner Ear Pastel Pink -->
    <linearGradient id="earPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Soft Glass Rim Highlight -->
    <linearGradient id="rimGlow" x1="20" y1="20" x2="220" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. Outer App Squircle Card with 3D Pop -->
  <g filter="url(#cuteShadow)">
    <rect x="20" y="20" width="200" height="200" rx="54" fill="url(#squircleBg)" />
    <rect x="23" y="23" width="194" height="194" rx="51" fill="url(#rimGlow)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="26" y="26" width="188" height="188" rx="48" fill="url(#glassPillow)" />
  </g>

  <!-- Ambient Light Bokeh Circles -->
  <circle cx="68" cy="62" r="38" fill="#F472B6" opacity="0.28" filter="blur(16px)" />
  <circle cx="178" cy="172" r="44" fill="#2DD4BF" opacity="0.32" filter="blur(18px)" />
  <circle cx="165" cy="58" r="32" fill="#FDE047" opacity="0.22" filter="blur(14px)" />

  <!-- 2. Cute Owl Character Inside the Lens -->
  <g id="Cute_Lumi_Owl">
    <!-- Fluffy Owl Ears with Tufted Tips -->
    <!-- Left Ear -->
    <path d="M64 88 C50 50, 78 42, 94 66 Z" fill="url(#owlBody)" />
    <path d="M68 83 C59 58, 77 52, 88 68 Z" fill="url(#earPink)" opacity="0.85" />
    <!-- Right Ear -->
    <path d="M176 88 C190 50, 162 42, 146 66 Z" fill="url(#owlBody)" />
    <path d="M172 83 C181 58, 163 52, 152 68 Z" fill="url(#earPink)" opacity="0.85" />

    <!-- Chubby Owl Body -->
    <ellipse cx="120" cy="128" rx="64" ry="58" fill="url(#owlBody)" />

    <!-- Cute Flapping Wings -->
    <!-- Left Wing -->
    <path d="M57 122 C42 130, 44 156, 64 160 C58 147, 56 135, 57 122 Z" fill="#4F46E5" />
    <!-- Right Wing -->
    <path d="M183 122 C198 130, 196 156, 176 160 C182 147, 184 135, 183 122 Z" fill="#4F46E5" />

    <!-- Soft Cream Heart-Shaped Face Mask & Belly -->
    <path d="M72 108 C72 84, 96 74, 120 90 C144 74, 168 84, 168 108 C168 148, 146 172, 120 172 C94 172, 72 148, 72 108 Z" fill="url(#owlTummy)" />

    <!-- Cute Rosy Cheeks -->
    <ellipse cx="85" cy="133" rx="9" ry="5.5" fill="#FB7185" opacity="0.65" />
    <ellipse cx="155" cy="133" rx="9" ry="5.5" fill="#FB7185" opacity="0.65" />

    <!-- Left Big Anime-Cute Sparkle Eye -->
    <circle cx="97" cy="116" r="14" fill="#0F172A" />
    <circle cx="93" cy="111" r="5.5" fill="#FFFFFF" />
    <circle cx="102" cy="121" r="2.5" fill="#A5B4FC" />

    <!-- Tiny Kawaii Beak -->
    <path d="M114 122 Q120 118 126 122 L120 132 Z" fill="url(#goldGrad)" />

    <!-- Right Eye with Smart Career Optical Monocle -->
    <circle cx="143" cy="116" r="14" fill="#0F172A" />
    <circle cx="139" cy="111" r="5.5" fill="#FFFFFF" />
    <circle cx="148" cy="121" r="2.5" fill="#2DD4BF" />

    <!-- Cute Little Orange Owl Toes -->
    <ellipse cx="104" cy="182" rx="8" ry="4.5" fill="url(#goldGrad)" />
    <ellipse cx="136" cy="182" rx="8" ry="4.5" fill="url(#goldGrad)" />
  </g>

  <!-- 3. Smart CareerLens Monocle Magnifying Ring Over Eye -->
  <g id="CareerLens_Monocle">
    <!-- Big Glowing Lens Circle -->
    <circle cx="143" cy="116" r="23" fill="url(#lensGlass)" stroke="#0D9488" stroke-width="4.5" />
    <circle cx="143" cy="116" r="21" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.8" />
    <!-- Glass Glare Crescent Reflection -->
    <path d="M130 102 C135 98, 143 97, 151 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Golden Monocle Chain & Sparkle Drop -->
    <path d="M166 122 Q174 135 170 148" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="170" cy="151" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- 4. Top Magic AI Sparkle / North Star Antenna -->
  <g id="Magic_AI_Sparkles">
    <!-- Mini Head Star (Career Navigator) -->
    <path d="M120 38 L123 46 L131 49 L123 52 L120 60 L117 52 L109 49 L117 46 Z" fill="url(#goldGrad)" />
    <circle cx="120" cy="49" r="2" fill="#FFFFFF" />

    <!-- Cute Baby Sparkle (Top-Left) -->
    <path d="M52 46 L53.5 50.5 L58 52 L53.5 53.5 L52 58 L50.5 53.5 L46 52 L50.5 50.5 Z" fill="#F43F5E" />
    <!-- Tiny Twinkle (Top-Right) -->
    <circle cx="192" cy="74" r="3" fill="#2DD4BF" />
    <circle cx="48" cy="168" r="2.5" fill="#A855F7" opacity="0.7" />
  </g>
</svg>
